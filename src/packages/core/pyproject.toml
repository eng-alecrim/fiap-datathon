[project]
name = "core"
version = "0.1.0"
description = "Core functionality for fiap-datathon"
authors = [
    { name = "eng-alecrim", email = "lucasalecrimvieira@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
  "common",
  "pandas>=2.2.3",

  "polars>=1.27.1",
  "pyarrow>=19.0.1",


  "matplotlib>=3.10.1",
  "seaborn>=0.13.2",
  "plotly>=6.0.1",


  "scikit-learn>=1.6.1",
  "xgboost>=3.0.0",


  "torch>=2.6.0",


  "mlflow>=2.21.3",

]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
