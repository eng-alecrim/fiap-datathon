[project]
name = "database"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "common",
    "custom_nlp",
    "beanie>=1.29.0",
    "motor>=3.7.0",
    "pandas>=2.2.3",
    "pyarrow>=19.0.1",
]

[dependency-groups]
dev = [
  "black[jupyter]>=25.1.0",
  "pytest>=8.3.5",
  "pytest-cov>=6.1.1",
  "ipykernel>=6.29.5",
  "ipywidgets>=8.1.6",
  "taskipy>=1.14.1",
  "ruff>=0.11.5",
  "ignr>=2.2",
]

[tool.ruff]
line-length = 88
extend-exclude = ["migrations", "data"]

[tool.ruff.lint]
preview = true
select = ["I", "F", "E", "W", "PL", "PT"]
ignore = ["PLR1711", "E731"]

[tool.ruff.format]
preview = true
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = "."
addopts = "-p no:warnings --cov=packages --cov-report=html:coverage_report -vv"
testpaths = ["tests"]

[tool.taskipy.tasks]
# Development workflow tasks
lint = "ruff check ."
format = "ruff format ."
test = "pytest"
cov = "pytest --cov=src --cov-report=term-missing"
precommit = "task format && task lint && task test"

# Notebook conversion
nb-to-script = "jupyter nbconvert --to python notebooks/*.ipynb --output-dir=python_scripts/"
