[project]
name = "custom-nlp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "eng-alecrim", email = "lucasalecrimvieira@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "nltk>=3.9.1",
    "spacy>=3.8.5",
    "gensim>=4.3.3",
    "sentence-transformers>=4.1.0",
    "huggingface-hub[hf-xet]>=0.30.2",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "pt-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/pt_core_news_sm-3.8.0/pt_core_news_sm-3.8.0-py3-none-any.whl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Add isto aqui para dar bom com o Spacy
[tool.hatch.metadata]
allow-direct-references = true