[project]
name = "common"
version = "0.1.0"
description = "Common libraries for fiap-datathon"
authors = [
    { name = "eng-alecrim", email = "lucasalecrimvieira@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.11.3",
  "pydantic-settings>=2.8.1",
  "loguru>=0.7.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
